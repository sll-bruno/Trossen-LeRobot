[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trossen-experiment"
version = "0.1.0"
description = "Fail-closed collection and evaluation harness for the bimanual Trossen experiment"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "Pillow>=9"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
trossen-experiment = "trossen_experiment.cli:main"

[tool.setuptools.packages.find]
include = ["trossen_experiment*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
